[project]
name = "knowledge-ingestment-pipeline"
version = "0.2.0"
description = "Multi-format document ingestion pipeline with quality review and vector storage"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web crawling (existing)
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "requests>=2.33.0",
    # Confluence
    "atlassian-python-api>=3.41.0",
    # Document conversion
    "docling==2.88.0",
    "docling-core==2.73.0",
    # Vector stores
    "redis[hiredis]>=5.0.3",
    "qdrant-client>=1.9.0",
    # Embeddings
    "openai>=1.30.0",
    # Config / utilities
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.1",
    "click>=8.1.7",
    "rich>=13.7.0",
    # UI
    "streamlit>=1.40.0",
    # Document ledger / staging
    "pymongo==4.16.0",
    # Confluence refresh scheduler
    "apscheduler>=3.10.0",
    "croniter>=2.0.0",
]
