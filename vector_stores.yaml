# Vector store configurations.
#
# Each entry requires:
#   id:         unique key — must match vector_store_id stored in corpora
#   name:       display name shown in the UI
#   type:       redis | custom | tachyon
#
# String values may reference environment variables using ${VAR_NAME} syntax.
# Secrets (URLs, API keys) should always be kept in .env, not hard-coded here.
#
# After editing this file, restart the Streamlit app to pick up changes.

vector_stores:

  # ── Built-in Redis (matches REDIS_URL / REDIS_INDEX_NAME from .env) ──────────
  - id: default
    name: Default Redis
    type: redis
    collection: ${REDIS_INDEX_NAME}
    extra:
      redis_url: ${REDIS_URL}
      index_name: ${REDIS_INDEX_NAME}
      key_prefix: ${REDIS_KEY_PREFIX}

  # ── Example: second Redis instance ───────────────────────────────────────────
  # - id: staging-redis
  #   name: Staging Redis
  #   type: redis
  #   collection: staging_index
  #   extra:
  #     redis_url: ${REDIS_STAGING_URL}
  #     index_name: staging_index
  #     key_prefix: "stg:"

  # ── Example: custom HTTP vector store ────────────────────────────────────────
  # - id: my-custom-store
  #   name: Production Custom Store
  #   type: custom
  #   endpoint: ${VS_ENDPOINT}
  #   api_key: ${VS_API_KEY}
  #   collection: my_collection

  # ── Tachyon (internal GenAI service) ─────────────────────────────────────────
  # Tachyon handles its own vectorization. Auth uses Apigee OAuth + mTLS certs.
  # Add one entry per Tachyon endpoint / usecase. All secrets go in .env.
  #
  # - id: tachyon-prod
  #   name: Tachyon Production
  #   type: tachyon
  #   collection: my-corpus-name        # Tachyon corpus / collection identifier
  #   extra:
  #     consumer_key:    ${TACHYON_CONSUMER_KEY}
  #     consumer_secret: ${TACHYON_CONSUMER_SECRET}
  #     api_key:         ${TACHYON_API_KEY}
  #     usecase_id:      ${TACHYON_USECASE_ID}
  #     apigee_url:      ${TACHYON_APIGEE_URL}
  #     search_url:      ${TACHYON_SEARCH_URL}
  #     completion_url:  ${TACHYON_COMPLETION_URL}
  #     cert_path:       ${TACHYON_CERT_PATH}     # path to client .crt file
  #     key_path:        ${TACHYON_KEY_PATH}      # path to client .key file
  #     ca_bundle:       ${TACHYON_CA_BUNDLE}     # path to CA bundle / root cert
